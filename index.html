<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Reading Library</title>
<script src="assets/marked.min.js"></script>
<script src="assets/purify.min.js"></script>
<style>
  :root { --bg:#fff; --fg:#1f2328; --muted:#59636e; --line:#d1d9e0; --card:#f6f8fa; --chip:#ddf4ff; --chip-fg:#0969da; --accent:#1f883d; --code:#f6f8fa; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --line:#3d444d; --card:#151b23; --chip:#121d2f; --chip-fg:#4493f8; --accent:#3fb950; --code:#151b23; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  a { color:var(--chip-fg); text-decoration:none; } a:hover { text-decoration:underline; }
  .wrap { max-width:880px; margin:0 auto; padding:28px 16px 64px; }
  header h1 { margin:0; font-size:24px; }
  .stats { color:var(--muted); font-size:13px; margin-top:2px; }
  .controls { position:sticky; top:0; background:var(--bg); padding:14px 0 10px; z-index:2; border-bottom:1px solid var(--line); }
  #q { width:100%; font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .chip { font-size:12px; padding:3px 9px; border-radius:999px; border:1px solid var(--line); background:var(--bg); color:var(--fg); cursor:pointer; }
  .chip.on { background:var(--fg); color:var(--bg); border-color:var(--fg); }
  .tag { font-size:12px; padding:1px 8px; border-radius:999px; background:var(--chip); color:var(--chip-fg); cursor:pointer; }
  .item { padding:16px 0; border-bottom:1px solid var(--line); }
  .item h2 { font-size:17px; margin:0 0 2px; line-height:1.35; }
  .meta { color:var(--muted); font-size:13px; display:flex; flex-wrap:wrap; gap:4px 10px; align-items:center; }
  .sum { margin:6px 0; }
  .hl { margin:6px 0; padding-left:10px; border-left:3px solid var(--accent); color:var(--muted); font-style:italic; }
  .row { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .badge { font:12px ui-monospace, SFMono-Regular, Menlo, monospace; padding:1px 6px; border-radius:4px; background:var(--card); border:1px solid var(--line); color:var(--fg); }
  .empty { color:var(--muted); padding:40px 0; text-align:center; }
  #reader { display:none; }
  #reader .back { display:inline-block; margin-bottom:12px; }
  .md img { max-width:100%; border:1px solid var(--line); border-radius:6px; }
  .md pre { background:var(--code); padding:12px; border-radius:6px; overflow-x:auto; font-size:13px; }
  .md code { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; }
  .md :not(pre) > code { background:var(--code); padding:1px 5px; border-radius:4px; font-size:90%; }
  .md blockquote { margin:0; padding-left:12px; border-left:3px solid var(--line); color:var(--muted); }
  .md table { border-collapse:collapse; display:block; overflow-x:auto; } .md td, .md th { border:1px solid var(--line); padding:4px 8px; }
  .md h1 { font-size:26px; line-height:1.25; }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>📚 My Reading Library</h1><div class="stats" id="stats">Loading…</div></header>
  <div id="list">
    <div class="controls">
      <input id="q" type="search" placeholder="Search titles, summaries, highlights, tags, sites…" autocomplete="off">
      <div class="chips" id="types"></div>
      <div class="chips" id="tagChips"></div>
    </div>
    <div id="items"></div>
  </div>
  <div id="reader"><a href="#" class="back">← All saves</a><article class="md" id="doc"></article></div>
</div>
<script>
const TYPES = { article: '📄 Articles', link: '🔗 Links', selection: '✂️ Highlights', screenshot: '📸 Screenshots', mhtml: '🗂️ Page snapshots' };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let all = [], state = { q: '', type: '', tag: '' };

fetch('data/index.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : []).catch(() => []).then(data => {
  all = data;
  const snippets = all.reduce((n, e) => n + (e.snippets || []).length, 0);
  document.getElementById('stats').textContent = `${all.length} saves · ${snippets} code snippets · ${new Set(all.flatMap(e => e.tags || [])).size} topics`;
  renderFilters(); route();
});

function renderFilters() {
  const types = [...new Set(all.map(e => e.type))];
  document.getElementById('types').innerHTML = [['', 'All'], ...types.map(t => [t, TYPES[t] || t])]
    .map(([t, l]) => `<button class="chip ${state.type === t ? 'on' : ''}" data-type="${esc(t)}">${esc(l)}</button>`).join('');
  const counts = {};
  all.forEach(e => (e.tags || []).forEach(t => counts[t] = (counts[t] || 0) + 1));
  document.getElementById('tagChips').innerHTML = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 30)
    .map(([t, n]) => `<span class="tag ${state.tag === t ? 'on' : ''}" data-tag="${esc(t)}" style="${state.tag === t ? 'outline:2px solid currentColor' : ''}">#${esc(t)} <span style="opacity:.6">${n}</span></span>`).join('');
}

function renderList() {
  const q = state.q.toLowerCase().trim();
  const rows = all.filter(e => (!state.type || e.type === state.type) && (!state.tag || (e.tags || []).includes(state.tag)) &&
    (!q || [e.title, e.summary, e.highlight, e.note, e.site, e.url, ...(e.tags || [])].join(' ').toLowerCase().includes(q)));
  document.getElementById('items').innerHTML = rows.length ? rows.map(e => `
    <div class="item">
      <h2><a href="#/${encodeURIComponent(e.id)}">${esc(e.title)}</a></h2>
      <div class="meta"><span>${esc((TYPES[e.type] || e.type).split(' ')[0])}</span><a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.site || e.url)}</a><span>${esc((e.saved || '').slice(0, 10))}</span></div>
      ${e.highlight ? `<div class="hl">“${esc(e.highlight.slice(0, 280))}${e.highlight.length > 280 ? '…' : ''}”</div>` : ''}
      ${e.summary ? `<div class="sum">${esc(e.summary)}</div>` : ''}
      ${e.note ? `<div class="meta">📝 ${esc(e.note)}</div>` : ''}
      <div class="row">${(e.tags || []).map(t => `<span class="tag" data-tag="${esc(t)}">#${esc(t)}</span>`).join('')}
        ${(e.snippets || []).map(s => `<a class="badge" href="${esc(s.file)}" target="_blank" title="Code snippet">${esc(s.file.split('/').pop())}</a>`).join('')}
        ${e.snapshot ? `<a class="badge" href="${esc(e.snapshot)}" target="_blank">snapshot</a>` : ''}</div>
    </div>`).join('') : `<div class="empty">${all.length ? 'Nothing matches.' : 'No saves yet — use the GitClip extension to save your first page.'}</div>`;
}

async function openEntry(id) {
  const e = all.find(x => x.id === id);
  const doc = document.getElementById('doc');
  if (!e) { doc.innerHTML = '<p class="empty">Not found.</p>'; return; }
  doc.innerHTML = '<p class="empty">Loading…</p>';
  let md = await fetch(`${e.path}/index.md`, { cache: 'no-store' }).then(r => r.text()).catch(() => '');
  md = md.replace(/^---\n[\s\S]*?\n---\n/, '').replace(/\]\(\.\//g, `](${e.path}/`);
  doc.innerHTML = DOMPurify.sanitize(marked.parse(md));
  doc.querySelectorAll('a[href^="http"]').forEach(a => { a.target = '_blank'; a.rel = 'noopener'; });
  window.scrollTo(0, 0);
}

function route() {
  const m = location.hash.match(/^#\/(.+)/);
  document.getElementById('list').style.display = m ? 'none' : 'block';
  document.getElementById('reader').style.display = m ? 'block' : 'none';
  if (m) openEntry(decodeURIComponent(m[1])); else renderList();
}
window.addEventListener('hashchange', route);
document.getElementById('q').addEventListener('input', e => { state.q = e.target.value; renderList(); });
document.addEventListener('click', e => {
  const t = e.target.closest('[data-type],[data-tag]');
  if (!t) return;
  if (t.dataset.type !== undefined) state.type = t.dataset.type;
  if (t.dataset.tag !== undefined) state.tag = state.tag === t.dataset.tag ? '' : t.dataset.tag;
  if (location.hash) location.hash = ''; renderFilters(); renderList();
});
document.querySelector('.back').addEventListener('click', e => { e.preventDefault(); history.length > 1 ? history.back() : (location.hash = ''); });
</script>
</body>
</html>
